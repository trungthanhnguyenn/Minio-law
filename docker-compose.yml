services:
  minio:
    image: quay.io/minio/minio
    container_name: minio
    ports:
      - "1000:9000"   
      - "1001:9001"   
    environment:
      MINIO_ROOT_USER: USERNAME          
      MINIO_ROOT_PASSWORD: P@SSWORD   
    volumes:
      - ./minio/data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
